name: Patientor API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './patientor-backend/package-lock.json'

    - name: Install patientor backend dependencies
      run: npm ci
      working-directory: ./patientor-backend

    - name: Start patientor backend server
      run: npm run dev &
      working-directory: ./patientor-backend

    - name: Install test dependencies
      run: npm ci
      working-directory: ./patientor-api-tests

    - name: Run API tests
      run: npm test
      working-directory: ./patientor-api-tests

    - name: Stop patientor backend server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid)
        fi
      working-directory: ./patientor-backend

   
  

