name: Health app E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install healthapp dependencies
        working-directory: ./healthapp
        run: npm ci

      - name: Install healthapp-tests dependencies
        working-directory: ./healthapp-tests
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./healthapp-tests
        run: npx playwright install --with-deps

      - name: Run Health app E2E tests
        working-directory: ./healthapp-tests
        run: npm test

