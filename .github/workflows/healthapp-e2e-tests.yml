name: Health app E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'healthapp/**'
      - 'healthapp-tests/**'
      - '.github/workflows/healthapp-e2e-tests.yml'

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install healthapp dependencies
        working-directory: ./healthapp
        run: npm ci

      - name: Install healthapp-tests dependencies
        working-directory: ./healthapp-tests
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./healthapp-tests
        run: npx playwright install --with-deps

      - name: Start server and run Health app E2E tests
        run: |
          npm --prefix ./healthapp start > server.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0 || (cat server.log && exit 1)
          npm --prefix ./healthapp-tests test




